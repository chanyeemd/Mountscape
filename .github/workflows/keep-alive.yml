YAML
name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天的台灣時間早上 08:00 自動執行一次（UTC 00:00）
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 允許隨時在 GitHub 頁面手動點擊測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase entries table
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            -X GET "https://busztrwndoxlltqrftuf.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_291SlLjCiXN6GF14lhjXvg_7WtT2rIc" \
            -H "Authorization: Bearer sb_publishable_291SlLjCiXN6GF14lhjXvg_7WtT2rIc"
